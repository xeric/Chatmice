name: Publish Sparkle Appcast

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  appcast:
    name: Publish update feed
    if: github.repository == 'xeric/Chatmice'
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download published update archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appcast"
          cp appcast.xml "$RUNNER_TEMP/appcast/appcast.xml"
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Chatmice-*.zip" \
            --dir "$RUNNER_TEMP/appcast"
          test -n "$(find "$RUNNER_TEMP/appcast" -maxdepth 1 -name 'Chatmice-*.zip' -print -quit)"

      - name: Download Sparkle 2.6.4 tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/Sparkle-2.6.4.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle-2.6.4.tar.xz" -C "$RUNNER_TEMP/sparkle"
          test -x "$RUNNER_TEMP/sparkle/bin/generate_appcast"

      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/sparkle-private-key"
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle-private-key" \
            --download-url-prefix "https://github.com/xeric/Chatmice/releases/download/$TAG_NAME/" \
            --link "https://github.com/xeric/Chatmice/releases/tag/$TAG_NAME" \
            --maximum-versions 10 \
            -o "$RUNNER_TEMP/appcast/appcast.xml" \
            "$RUNNER_TEMP/appcast"
          cp "$RUNNER_TEMP/appcast/appcast.xml" appcast.xml
          rm -f "$RUNNER_TEMP/sparkle-private-key"

      - name: Commit update feed
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "release: update appcast for $TAG_NAME"
          git push origin main

      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private-key"
